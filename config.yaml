# =============================================================================
#  Weekly Momentum Breakout Scanner  +  5-min Entry
#  Every value under `strategy:` maps 1:1 to an input in the Pine indicator.
#  Change them here and the Python entry stays identical to the chart.
# =============================================================================

strategy:
  # --- Scanner settings (Pine group "Scanner settings")
  len_long: 52            # Long breakout lookback (weeks)
  len_short: 26           # Short breakout lookback (weeks)  <- the entry level
  ema_fast_len: 20        # Weekly EMA fast
  ema_slow_len: 50        # Weekly EMA slow
  ema_slow_back: 2        # EMA slow rising vs N weeks ago
  rsi_len: 14             # Weekly RSI length
  rsi_min: 60             # Weekly RSI minimum
  macd_fast: 12
  macd_slow: 26
  macd_sig: 9
  vol_sma_len: 10         # Weekly volume SMA length
  min_price: 100          # Min daily close

  # --- Market cap (Pine c12)
  # Dhan has no shares-outstanding endpoint, so this is OFF and c12 auto-passes.
  # To enforce it: set use_mcap true and add data/mcap.csv (symbol,mcap_in_crore).
  use_mcap: false
  min_mcap: 1000

  # --- Entry (Pine group "Entry")
  # Keep the gate ON. Turning it off produced 82 trades in one day - 22 of
  # them on the 09:15 Monday bar alone, where "already above the level" was
  # mistaken for a fresh breakout. Net -Rs 13,851, win rate 33%, PF 0.73.
  strict_entry: true

  # Tolerance: allow up to N of the gate rows to fail, so a genuinely strong
  # breakout is not blocked by ONE marginal reading (e.g. weekly RSI 59.8).
  # The BREAKOUT IS NEVER RELAXED - the close above the 26W level is proven by
  # the cross itself. Fresh-breakout, min-price and market-cap stay mandatory.
  #   0 = STRICT 13/13 (shipped) - matches the original Chartink scan exactly
  #   1 = conservative; on 27-Jul this still let ~28 extra names through
  #   2 = looser; gave 37 trades
  # Measured on 27-Jul: the known-good breakouts had a MEDIAN OF 0 failing
  # rows, the false ones a median of 1 - so any tolerance above 0 admits
  # precisely the names you did not want.
  gate_tolerance: 0
  gate_source: live       # "live"  = developing week, matches the table (Pine default)
                          # "closed" = last closed week, non-repainting
  defer_entry: true       # fire later in the week if the gate turns true after the cross
  gate_daily: false       # also require the previous completed daily bar to be green
  req52: false            # also require close above the 52W level
  one_per_week: true      # only the first entry per symbol per week

universe:
  exchange_segments: [NSE_EQ]     # add BSE_EQ for the BSE cash segment too
  series: [EQ, BE]                # EQ = normal rolling settlement, BE = trade-to-trade
  exclude_etf: true
  include_symbols: []             # non-empty = whitelist only these
  exclude_symbols: []
  max_symbols: null               # cap the universe (useful while testing)

runtime:
  history_years: 5                # daily history pulled for the weekly snapshot
  min_weekly_bars: 60
  prefilter: true                 # bulk-quote funnel before the per-symbol replay
  prefilter_headroom_pct: 0.0     # >0 keeps names slightly below the level too
  max_workers: 4
  data_rate_per_sec: 4            # Dhan allows 5/s; stay just under to leave
                                  # headroom - at exactly 5 any jitter or retry
                                  # trips 429 (70 symbols were lost that way).
  quote_rate_per_sec: 1           # Dhan Quote API limit
  market_open: "09:15"
  market_close: "15:30"
  bar_interval_min: 5
  alert_cooldown_bars: 0
  dry_run: false                  # true = log alerts instead of sending them
