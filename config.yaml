# =============================================================================
#  Weekly Momentum Breakout Scanner  +  5-min Entry
#  Every value under `strategy:` maps 1:1 to an input in the Pine indicator.
#  Change them here and the Python entry stays identical to the chart.
# =============================================================================

strategy:
  # --- Scanner settings (Pine group "Scanner settings")
  #
  # BREAKOUT LEVEL - SETTLED 28-Jul-2026 (user decision: "Option B").
  # entry_level = highest(high, 26) INCLUDING the last closed week.
  # Do NOT shift it back a week to match the orange line on a TradingView
  # screenshot. That line is a rendering artifact: Pine fetches the level via
  # request.security(..., lookahead_off), which during a developing week
  # returns the TWO-weeks-back value, while the indicator's own 13-row table
  # shows the correct one. Pixel-measured on the user's charts:
  #     TMB     plotted 821.29 / table 847.00   <- table is right
  #     RADICO  plotted 4161.57 / table 4193.00 <- table is right
  # The BUY arrows follow the lagged line, so the arrows are wrong, not us.
  # Entering at the lagged value means entering BELOW the real 26-week high,
  # i.e. before a breakout has actually happened. Guarded by BUG 21 tests.
  len_long: 52            # Long breakout lookback (weeks)
  len_short: 26           # Short breakout lookback (weeks)  <- the entry level
  ema_fast_len: 20        # Weekly EMA fast
  ema_slow_len: 50        # Weekly EMA slow
  ema_slow_back: 2        # EMA slow rising vs N weeks ago
  rsi_len: 14             # Weekly RSI length
  rsi_min: 60             # Weekly RSI minimum
  macd_fast: 12
  macd_slow: 26
  macd_sig: 9
  vol_sma_len: 10         # Weekly volume SMA length
  min_price: 100          # Min daily close

  # --- Market cap (Pine c12) --- ENABLED 29-Jul-2026
  #
  # Dhan exposes no shares-outstanding field, so this was off for months and
  # c12 auto-passed - which is how GANESHBE (881 Cr) and PYRAMID (665 Cr)
  # reached your phone even though Chartink would reject them.
  #
  # mcap.py now builds mcap.csv as shares-outstanding x price. Validated
  # against the c12 value on nine of your own TradingView screenshots; the
  # error ran -3.9%..+2.3% (DIVISLAB +0.3%, LALPATHLAB -0.1%, RADICO +2.3%).
  #
  # On this week's 24 alerts it keeps 22 and blocks exactly the two names
  # below 1000 Cr.
  #
  # SAFETY: a symbol MISSING from mcap.csv is treated as UNKNOWN and PASSES.
  # Blocking on missing data would silently delete stocks from the scan.
  # Rebuild the table with `python mcap.py` (~30s for the whole universe);
  # the Weekly Snapshot workflow does it automatically.
  use_mcap: true
  min_mcap: 1000
  # Tolerance for the few-percent error in reported share counts, so a stock
  # computing at 1010 Cr that is really 980 is not dropped on a rounding call.
  mcap_margin_pct: 5.0

  # --- Entry (Pine group "Entry")
  # ORIGINAL, VALIDATED SETTING - do not change without re-running paper.py.
  # On 27-Jul this produced exactly the 5 valid names (RATNAVEER, MONARCH,
  # SENCO, PYRAMID, TMB) + CREDITACC. Measured alternatives, same day:
  #   gate_tolerance 1 or 2  -> +28 false names
  #   volume_prorate true    -> 26 signals
  #   gate_source "closed"   -> 20 signals, only 1 of the valid 5
  strict_entry: true

  # Both kept at their Pine-equivalent values. See the note above.
  #   gate_tolerance 1/2 -> +28 false names
  #   volume_mode "day"  -> 19 signals (15 false); "bar" -> 26 (22 false)
  # c09 (weekly volume > 10w average) is the single strongest filter in the
  # scan. Relaxing it in ANY form re-opens the floodgate, so it stays raw.
  #
  # PROVEN IMPOSSIBLE (28-Jul): no c09 setting satisfies both of the user's
  # own examples at once. In pace mode c09 passes when ratio > frac * m:
  #     VAIBHAVGBL Tue 10:35  ratio 0.4837 frac 0.2453 -> needs m <  1.972
  #     RADICO     Tue 14:50  ratio 0.9325 frac 0.3813 -> needs m >= 2.445
  # Feasible range [2.445, 1.972) is EMPTY. Furthermore VAIBHAVGBL spent 9
  # bars above its level (Tue 10:35-14:10) and had c09 true for exactly 1 bar
  # (Tue 15:25) - zero overlap, so it is a genuine REJECT that week, not a
  # miss. Stop tuning this knob. See BUG 21 in test_regressions.py.
  gate_tolerance: 0
  volume_mode: "off"
  # Conviction multiple used only when volume_mode = "pace".
  # Swept on 27+28 Jul data (37 stocks, 8 known-good). NO multiple beat raw
  # c09 on either precision or deferral count:
  #     raw c09    10 signals  70% precision   6 deferred   <-- best
  #     pace x2.5  20 signals  35% precision   9 deferred
  #     pace x4.0  17 signals  41% precision   9 deferred
  #     pace x6.0  11 signals  55% precision   7 deferred (and lost a good one)
  # Relaxing c09 admits weak names earlier; they then stall on OTHER rows, so
  # deferrals go UP. Kept for research only.
  volume_pace_mult: 2.5

  # --- Relative volume (optional extra filter, OFF by default) --------------
  # Volume today up to this minute vs the median up to the same minute over
  # the last N sessions. Unlike c09 it is time-of-day aware, so it means the
  # same thing at 09:20 and 15:20. On 27-Jul it separated valid from false
  # breakouts by ~20x (valid median 84.5, false 4.1).
  #
  # Shipped OFF because the full 13/13 gate already removes the low-volume
  # names - every survivor scored rvol > 11 - and using RVOL to relax c09
  # always LOWERED precision (strict 67% vs 57% with vol=day + rvol>=15).
  #
  #   off  - disabled (pure Pine)
  #   warn - measure and report, never block
  #   on   - require rvol >= rvol_min
  rvol_mode: "off"
  rvol_min: 5.0
  rvol_lookback_sessions: 20


  # --- c09 REMOVED FROM THE LIVE GATE (31-Jul-2026) ------------------------
  # c09 is "weekly volume > 10-week average". Early in a week that volume
  # simply has not traded yet, so the row cannot pass on merit - it passes only
  # once the move itself creates the volume. The entry therefore arrives AFTER
  # the move, which is the opposite of what a breakout signal is for.
  #
  # YASHO, 31-Jul-2026, is the case that settled it:
  #     level 3262.80, opened 3258.90 (already at the level)
  #     weekly volume:  Mon 0.08x  Tue 0.19x  Wed 0.51x  Fri 2.24x
  #     c09 flipped true only at 12:20, price 3690.90  -> alerted 13.1% high
  #     day high 3858.70. From the level +18.3%; from the alert +4.5%.
  #     75% of the move was gone before the alert was sent.
  #
  # Measured point-in-time over 5 years, 18,259 tradeable breakouts, comparing
  # the SAME trades entered early vs entered when the full gate allowed it:
  #
  #     hold        early (drop_c09)     gated (c09 on)     difference
  #     next close      +0.45% t 12.7        +0.16% t  4.3       +0.30
  #     2 days          +0.68% t 13.7        +0.09% t  1.8       +0.59
  #     3 days          +0.96% t 16.5        +0.15% t  2.6       +0.81
  #     5 days          +1.26% t 17.4        +0.36% t  5.0       +0.90
  #
  # And c09 never let 37% of breakouts through AT ALL that week - those are
  # entries that simply never arrived. Of the ones it did allow, the median
  # delay was 0 days but the mean chase was +0.95%, with 6.3% chased >=5%.
  #
  # Volume conviction is NOT abandoned: it moves to min_weekly_vol_x, which
  # tests CLOSED weekly volume (a full week that actually traded) instead of a
  # half-formed week, and to the breakout-day rvol used by the BTST tier.
  drop_c09: true

  # CHASE GUARD - TESTED AND REJECTED, left OFF deliberately.
  #
  # It seemed obvious that with c09 gone we should also refuse signals far
  # above the level. Measured, it is wrong at every threshold - capping makes
  # returns WORSE, not better:
  #
  #     cap    n/week    1d       3d       5d     5d OOS
  #     off      70.9  +0.014   +0.078   +0.221   -0.125
  #      3%      50.0  -0.089   -0.029   +0.103   -0.227
  #      5%      60.8  -0.031   +0.035   +0.174   -0.175
  #     10%      68.5  -0.010   +0.060   +0.215   -0.100
  #
  # The reason is the same one that made c03 measure negative: an extended
  # breakout is a STRONG breakout. Cutting the extended ones removes the tail
  # the strategy lives on - a 5% cap would have discarded 343 of the 417 Tier A
  # BTST setups. Once c09 is off the entry is already near the cross, so the
  # remaining "extension" is genuine strength, not lateness.
  max_ext_above_level: 0.0

  gate_source: live       # "live"  = developing week, matches the table (Pine default)
                          # "closed" = last closed week, non-repainting
  defer_entry: true       # fire later in the week if the gate turns true after the cross
  gate_daily: false       # also require the previous completed daily bar to be green
  req52: false            # also require close above the 52W level
  one_per_week: true      # only the first entry per symbol per week

universe:
  exchange_segments: [NSE_EQ]     # add BSE_EQ for the BSE cash segment too
  series: [EQ, BE]                # EQ = normal rolling settlement, BE = trade-to-trade
  exclude_etf: true
  include_symbols: []             # non-empty = whitelist only these
  exclude_symbols: []
  max_symbols: null               # cap the universe (useful while testing)

runtime:
  history_years: 5                # daily history pulled for the weekly snapshot
  min_weekly_bars: 60
  prefilter: true                 # bulk-quote funnel before the per-symbol replay
  prefilter_headroom_pct: 0.0     # >0 keeps names slightly below the level too
  # BUG 50 (03-Aug-2026). The Monday rebuild degraded from 1.8 s/symbol to
  # 4.1 s/symbol once Dhan started returning 429s, projecting ~2.6 hours for
  # 2,372 symbols. Every 429 triggers a GLOBAL pause (RateLimiter.pause), so
  # four threads racing the same bucket make the whole build slower, not
  # faster - one thread's 429 stalls all of them.
  #
  # 3 workers x 3/sec is below Dhan's 5/sec ceiling with real headroom. It is
  # SLOWER in the best case and much faster in the realistic case, because it
  # avoids the backoff spiral.
  max_workers: 3
  data_rate_per_sec: 3            # Dhan allows 5/s; stay well under - see the
                                  # headroom - at exactly 5 any jitter or retry
                                  # trips 429 (70 symbols were lost that way).
  quote_rate_per_sec: 1           # Dhan Quote API limit
  market_open: "09:15"
  market_close: "15:30"
  bar_interval_min: 5
  alert_cooldown_bars: 0
  # Once a symbol fires, suppress same-cycle repeat breakouts for 26 weeks.
  # After expiry, a NEW 26-week-high cross is required before another alert.
  breakout_cooldown_weeks: 26
  dry_run: false                  # true = log alerts instead of sending them

# ---------------------------------------------------------------------------
# Precision OB tap scanner (ob_tap_scan.py) - stage 2 behind scan.py.
#
# scan.py answers "which stocks broke their 26-week high this week?". This
# answers the follow-up: "of those, which one has pulled back into a precise
# institutional order block and is being defended RIGHT NOW?".
#
#     scan.py marks state.json -> waiting list -> daily displacement -> origin
#     candle -> precision OB -> departure arms it -> live intraday tap -> alert
#
# The zone logic is a Pine-exact port of precision.txt ("Institutional OB -
# Precision Tap & Pre-Order"). The indicator inputs below are that file's
# defaults; ob_precision.OBParams validates them and rejects unknown keys.
#
# Nothing here changes any other job: state.json stays read-only input and this
# scanner writes only ob_precision_state.json. `enabled: false` switches the
# whole thing off.
# ---------------------------------------------------------------------------
ob_precision:
  enabled: true
  state_file: "ob_precision_state.json"   # its OWN state, never state.json

  # --- scanner runtime ---
  sessions: 250                 # daily bars per symbol (~one trading year)
  max_refresh_per_run: 250      # per-symbol history calls in one run; the
                                # backfill spreads over runs instead of blowing
                                # the workflow's timeout
  backfill_weeks: 26            # seed every first-alert cycle still inside the
                                # scanner's 26-week lock, even after weeks are pruned
  quote_batch: 1000             # Dhan OHLC limit per request
  alert_kinds: ["ob", "tap"]    # "approach"/"confirm"/"invalid" are computed
                                # but not sent: too noisy for a live chat
  alert_taps: [1]               # only the FIRST tap of a zone
  event_lookback_days: 5        # the first refresh replays a year of history;
                                # only closed-bar events this recent are alertable
                                # so the backfill cannot bury the chat
  resolve_on_tap: true          # "until tapped or invalidated"

  # --- the daily waiting-list digest ---
  # Alerts only name the symbols that did something; this is the whole list, so
  # it can be tracked by hand as well. Both slots ride the existing 5-minute
  # cron - no extra schedule - and the pre-open one costs no API calls.
  daily_digest: true
  digest_after_close: true      # recap: first post-close run with a complete cache
  digest_before_open: true      # plan for the day, from yesterday's closed levels
  digest_pre_open_at: "09:10"   # IST; must be before runtime.market_open (09:15)
  digest_max_rows: 0            # 0 = every name, chunked over several messages

  # --- 1: volume-confirmed displacement (precision.txt) ---
  vol_len: 20
  atr_len: 14
  min_rvol: 1.8
  min_range_atr: 1.20
  min_body_frac: 0.55
  min_clv: 0.72
  structure_len: 8
  origin_search: 8
  allow_neutral: true
  neutral_body: 0.20

  # --- 2: the exact order-block zone ---
  zone_method: "Open to low"          # | Body to low | Body only | Lower half of candle
  entry_mode: "Proximal"              # | 50% | 62% | 70.5% | 79% | Distal + 1 tick
  front_run_mode: "Auto"              # | ATR | Ticks | Off
  front_run_atr: 0.18
  front_run_ticks: 2
  max_zone_buffer: 0.40               # the front-run pad can never exceed 40% of the zone
  entry_offset_ticks: 0
  stop_atr: 0.15
  approach_atr: 0.25
  min_age: 3                          # bars between birth and the first legal tap
  max_zones: 30
  max_touches: 4                      # the 5th touch invalidates
  raise_after_first_tap: true
  repeat_tap_atr: 0.05
  require_departure: 1.0              # price must clear the zone by 1 ATR first

  # --- 3: optional defence confirmation ---
  confirm_bars: 3
  confirm_rvol: 1.3
  confirm_clv: 0.65
  confirm_bos_len: 3
  require_sweep: false
  sweep_len: 5

  # --- execution details Pine reads off the chart ---
  mintick: 0.05                       # NSE equity tick size
  live_atr_from_closed: true          # NON-REPAINT: freeze the developing bar's
                                      # thresholds at the last closed ATR
