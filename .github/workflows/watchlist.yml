name: Daily Watchlist

# Pre-market, Mon-Fri. 03:15 UTC = 08:45 IST - half an hour before the open,
# so the list is on your phone while you still have time to act on it.
#
# Levels are frozen for the whole week, so this is cheap: ONE bulk-quote pass
# over the snapshot (about 3 requests for the whole cash segment) and no
# per-symbol history at all.
on:
  schedule:
    - cron: "15 3 * * 1-5"
  workflow_dispatch:
    inputs:
      near:
        description: "Percent below the level to count as approaching"
        type: string
        default: "3"
      top:
        description: "How many names to list (blank = the code default, 8)"
        type: string
        default: ""

concurrency:
  group: watchlist
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watchlist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send the watchlist
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Do NOT hardcode --top here. watchlist.TOP_N is the single source
          # of truth (8 since BUG 47 - ranking beyond ~8 is noise, and the
          # list's measured ceiling is +0.09%/trade OOS). Passing 15 from the
          # workflow silently overrode the code and the message kept printing
          # "top 15" after the constant was changed.
          python watchlist.py \
            --near "${{ inputs.near || '3' }}" \
            ${{ inputs.top && format('--top {0}', inputs.top) || '' }}

      - name: Upload the watchlist CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchlist
          path: "watchlist_*.csv"
          if-no-files-found: ignore
          retention-days: 30

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "Telegram secrets not set - skipping failure notice"
            exit 0
          fi
          MSG=$'⚠️ <b>Daily watchlist failed</b>\n'"Check the log: ${RUN_URL}"
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MSG}" > /dev/null
