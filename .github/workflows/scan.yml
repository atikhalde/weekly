name: Intraday Scan (5m)

# NSE cash session 09:15-15:30 IST == 03:45-10:00 UTC.
# GitHub's scheduler is best-effort and can be late under load, but the scanner
# replays the ENTIRE week from the first 5m candle every run, so a skipped slot
# never loses a signal - the next run still finds the exact breakout candle.
on:
  schedule:
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside market hours"
        type: boolean
        default: false
      heartbeat:
        description: "Send a Telegram summary even with 0 signals"
        type: boolean
        default: false
      symbols:
        description: "Comma-separated subset (blank = whole universe)"
        type: string
        default: ""

concurrency:
  group: scan
  cancel-in-progress: false        # let a slow run finish; never overlap

permissions:
  contents: write                  # to commit state.json

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Run scanner
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scan.py \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.heartbeat && '--heartbeat' || '' }} \
            ${{ inputs.symbols && format('--symbols {0}', inputs.symbols) || '' }}

      - name: Persist alert state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: alert state $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      # NOTE: a step's `if:` cannot read an `env:` defined on that same step,
      # so the token check has to happen inside `run:`, not in the condition.
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "Telegram secrets not set - skipping failure notice"
            exit 0
          fi
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=⚠️ <b>Scanner run failed</b>
Check the log: ${RUN_URL}" > /dev/null
