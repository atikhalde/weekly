name: BTST Scan (15:20 IST)

# 09:50 UTC = 15:20 IST - TEN MINUTES BEFORE THE CLOSE, so the position can be
# entered TODAY at today's close. That timing is the whole point: scanning
# after the bell leaves only tomorrow's open, which forfeits the overnight move
# this model exists to capture.
#
# Today's daily candle does not exist yet at 15:20, so btst.py builds it from
# today's 5-minute bars and pro-rates the volume test for the elapsed session.
# Measured at this cutoff, 82% of flagged names still qualify at the close, and
# the entry is 0.14% CHEAPER than the close (these names ramp into the bell).
#
# BUG 55 - GITHUB CRON IS NOT RELIABLE ENOUGH FOR THIS JOB.
# On 03-Aug the message arrived at 15:48 IST - 28 minutes late, after the
# 15:30 close - and still said "BUY NOW". GitHub's scheduler is explicitly
# best-effort and deprioritises under load; a ten-minute entry window cannot
# be built on it.
#
# Two changes:
#   1. repository_dispatch, so cron-job.org can FIRE this job at exactly
#      15:18 IST the same way it already drives scan.yml. That is the real
#      fix - see CRON_JOBS.md for the curl payload.
#   2. btst.py now refuses to say "BUY NOW" after 15:30 (it marks the picks
#      MISSED and tradeable=0 instead), so if the schedule slips again the
#      alert is honest rather than unfillable.
#
# The cron below is now the FALLBACK, not the primary trigger.
#
# To wire cron-job.org (15:18 IST, Mon-Fri):
#   POST https://api.github.com/repos/atikhalde/weekly/dispatches
#   Header: Authorization: Bearer <PAT with repo scope>
#   Header: Accept: application/vnd.github+json
#   Body:   {"event_type":"btst"}
#
# It runs TWO scans and commits TWO lists:
#   btst_picks.csv        confirmed - broke out TODAY (Models E / E-wide)
#   anticipate_picks.csv  pre-breakout - within 3% and closed at the top of
#                         its range (Model F)
# Overlap between them is 0.1%, so they are reported and traded separately.
#
# It COMMITS btst_picks.csv - the top-5 list with the 15:20 entry price. That
# file is Model E's trade list: the 16:15 paper job reads it instead of
# re-deriving its own picks from the completed candle, so the alert you receive
# and the ledger entry are guaranteed to be the same trade at the same price.
# It never places orders and never touches state.json.
on:
  schedule:
    # 15:15 IST (Primary 15:15-15:20 BTST execution scan) and 15:10 IST (Warmup & early heads-up)
    - cron: "45 9 * * 1-5" # 09:45 UTC = 15:15 IST (Primary 15:15-15:20 BTST execution scan)
    - cron: "40 9 * * 1-5" # 09:40 UTC = 15:10 IST (Early heads-up & cache warmup)
  # Primary zero-latency trigger: cron-job.org POSTs {"event_type":"btst"} at 15:16 IST.
  repository_dispatch:
    types: [btst]
  workflow_dispatch:
    inputs:
      all:
        description: "List every breakout with its tier, not just A/B"
        type: boolean
        default: false
      after_close:
        description: "Post-close review: only judge completed daily candles"
        type: boolean
        default: false
      debug_vma:
        description: "Symbols (comma-separated) to log the raw volume window for"
        type: string
        default: ""

concurrency:
  group: btst
  cancel-in-progress: false

permissions:
  contents: write        # to commit btst_picks.csv

jobs:
  btst:
    runs-on: ubuntu-latest
    # BUG 59: 30 minutes was longer than the entry window itself. On 04-Aug
    # the job started 15:18 and was still running at 15:48 - killed AFTER the
    # close, producing nothing at all. btst.py now enforces its own 15:26
    # deadline and sends whatever is ready, so this only needs to cover
    # checkout + pip + a scan that has already stopped itself.
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan for BTST setups
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTPS_PROXY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
        run: |
          python btst.py \
            ${{ inputs.all && '--all' || '' }} \
            ${{ inputs.after_close && '--after-close' || '' }} \
            ${{ inputs.debug_vma && format('--debug-vma {0}', inputs.debug_vma) || '' }}

      - name: Commit the picks file
        if: success()
        run: |
          if [[ ! -f btst_picks.csv && ! -f anticipate_picks.csv && ! -f btst_alert_state.json ]]; then
            echo "no picks today - nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # btst_alert_state.json is the exact top3_actionable/next_anticipated
          # decision this run's Telegram message was built from (written by
          # btst.py's write_alert_state()) - committing it alongside the picks
          # CSVs is the 2026-08-13 fix for "paper trade report / backtest
          # don't match the alert": pdf_report.py reads this file instead of
          # re-deriving "today's picks" from the raw, multi-run-per-day CSVs,
          # which could (and did) pick up a different run's results.
          git add btst_picks.csv anticipate_picks.csv btst_alert_state.json 2>/dev/null || git add btst_picks.csv
          if git diff --cached --quiet; then
            echo "picks unchanged"
            exit 0
          fi
          git commit -m "BTST picks $(date -u +%Y-%m-%d)"
          # the 5m scan commits state.json on the same repo; rebase with -X theirs
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash -X theirs origin "${{ github.ref_name }}" && git push origin "${{ github.ref_name }}"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "could not push the picks file" >&2
          exit 1

      - name: Upload the BTST CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btst
          path: |
            btst_*.csv
            btst_picks.csv
            anticipate_picks.csv
            btst_alert_state.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "Telegram secrets not set - skipping failure notice"
            exit 0
          fi
          MSG=$'⚠️ <b>BTST scan failed</b>\n'"Check the log: ${RUN_URL}"
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MSG}" > /dev/null
