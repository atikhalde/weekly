name: Weekly Snapshot

# Rebuilds the frozen closed-week indicator state that the intraday scanner
# reads. Runs Monday 08:15 IST (02:45 UTC), an hour before the open, and again
# Sunday evening as a safety net.
on:
  schedule:
    - cron: "45 2 * * 1"       # Monday  08:15 IST
    - cron: "30 12 * * 0"      # Sunday  18:00 IST
  workflow_dispatch:
    inputs:
      fresh:
        description: "Rebuild from scratch (REQUIRED after any strategy change)"
        type: boolean
        default: false
      limit:
        description: "Only the first N symbols (blank = all)"
        type: string
        default: ""

concurrency:
  group: snapshot
  # BUG 49: was false. On 03-Aug a build hung for 4.5 hours; with the old
  # setting the next scheduled attempt would have queued behind it instead of
  # replacing it. A newer snapshot build always supersedes an older one.
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # ~10 min of API time + headroom. The build
                                 # resumes from a committed partial snapshot,
                                 # so a timeout is recoverable, not fatal.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Market caps for Pine c12. Cheap (~30s) and must run BEFORE the
      # snapshot, because build_snapshot.py stamps each row with the cap it
      # reads here. A failure is non-fatal: a missing table means every symbol
      # reports UNKNOWN, which passes c12 rather than blocking the scan.
      - name: Refresh market-cap table
        continue-on-error: true
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: python mcap.py

      - name: Build weekly snapshot
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: |
          python build_snapshot.py \
            ${{ inputs.fresh && '--fresh' || '' }} \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      # Keep the output even if the commit step later fails, so a 2-hour build
      # is never lost to a git problem.
      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-snapshot
          path: |
            weekly_snapshot.csv
            universe.csv
          if-no-files-found: ignore
          retention-days: 14

      # always() so a CANCELLED or failed build still commits the rows it
      # managed to produce. Run #7 was cancelled at 49 min and the whole
      # snapshot was discarded because this step was skipped.
      - name: Commit snapshot
        if: always()
        run: |
          if [[ -n "$(git status --porcelain weekly_snapshot.csv universe.csv)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add weekly_snapshot.csv universe.csv mcap.csv
            git commit -m "data: weekly snapshot $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      - name: Report to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
        run: |
          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "Telegram secrets not set - skipping report"
            exit 0
          fi
          if [[ "${{ job.status }}" == "success" && -f weekly_snapshot.csv ]]; then
            ROWS=$(($(wc -l < weekly_snapshot.csv) - 1))
            MSG=$'✅ <b>Weekly snapshot rebuilt</b>\n'"${ROWS} symbols armed for the week."
          else
            MSG=$'🚨 <b>Weekly snapshot FAILED</b>\n'
            MSG+=$'The scanner does NOT fall back to old levels - it refuses to run.\n'
            MSG+=$'Expect NO alerts, NO shortlist and NO BTST scan until this is rebuilt.\n\n'
            MSG+=$'Re-run: Actions → Weekly Snapshot → Run workflow (tick <b>fresh</b>).'
          fi
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MSG}" > /dev/null
