name: Weekly Snapshot

# Rebuilds the frozen closed-week indicator state that the intraday scanner
# reads. Runs Monday 08:15 IST (02:45 UTC), an hour before the open, and again
# Sunday evening as a safety net.
on:
  schedule:
    - cron: "45 2 * * 1"       # Monday  08:15 IST
    - cron: "30 12 * * 0"      # Sunday  18:00 IST
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the first N symbols (blank = all)"
        type: string
        default: ""

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330         # a full cash universe takes a while at 5 req/s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build weekly snapshot
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: |
          python build_snapshot.py \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      # Keep the output even if the commit step later fails, so a 2-hour build
      # is never lost to a git problem.
      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-snapshot
          path: |
            weekly_snapshot.csv
            universe.csv
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit snapshot
        run: |
          if [[ -n "$(git status --porcelain weekly_snapshot.csv universe.csv)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add weekly_snapshot.csv universe.csv
            git commit -m "data: weekly snapshot $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      - name: Report to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "Telegram secrets not set - skipping report"
            exit 0
          fi
          if [[ "${{ job.status }}" == "success" && -f weekly_snapshot.csv ]]; then
            ROWS=$(($(wc -l < weekly_snapshot.csv) - 1))
            MSG=$'✅ <b>Weekly snapshot rebuilt</b>\n'"${ROWS} symbols armed for the week."
          else
            MSG=$'⚠️ <b>Weekly snapshot FAILED</b>\nThe scanner will keep using last week\'s levels.'
          fi
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MSG}" > /dev/null
