name: Weekly Snapshot

# Rebuilds the frozen closed-week indicator state that the intraday scanner
# reads. Runs Monday 08:15 IST (02:45 UTC), an hour before the open, and again
# Sunday evening as a safety net.
on:
  schedule:
    - cron: "45 2 * * 1"       # Monday  08:15 IST
    - cron: "30 12 * * 0"      # Sunday  18:00 IST
  workflow_dispatch:
    inputs:
      fresh:
        description: "Rebuild from scratch (REQUIRED after any strategy change)"
        type: boolean
        default: false
      limit:
        description: "Only the first N symbols (blank = all)"
        type: string
        default: ""

concurrency:
  group: snapshot
  # BUG 50: I set this to true believing the 03-Aug build had HUNG. It had not
  # - it was rate-limited and crawling (Dhan 429s pushed it from 1.8 s/symbol
  # to 4.1 s/symbol, projecting ~2.6 hours for 2,372 names). Cancelling a slow
  # but healthy build is strictly worse than letting it finish, especially now
  # that it resumes from a partial snapshot. Back to false.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330         # 5.5h. NOT arbitrary - see BUG 50. The build
                                 # resumes from a committed partial snapshot,
                                 # so a timeout is recoverable, not fatal.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Market caps for Pine c12. Cheap (~30s) and must run BEFORE the
      # snapshot, because build_snapshot.py stamps each row with the cap it
      # reads here. A failure is non-fatal: a missing table means every symbol
      # reports UNKNOWN, which passes c12 rather than blocking the scan.
      - name: Refresh market-cap table
        continue-on-error: true
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: python mcap.py

      - name: Build weekly snapshot
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: |
          # tee to build.log so the failure notice can name the CAUSE
          # (expired token vs rate limit) instead of just "FAILED".
          # PIPESTATUS keeps the real exit code - piping to tee would
          # otherwise mask a failure as success.
          set -o pipefail
          python build_snapshot.py \
            ${{ inputs.fresh && '--fresh' || '' }} \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} \
            2>&1 | tee build.log

      # Keep the output even if the commit step later fails, so a 2-hour build
      # is never lost to a git problem.
      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-snapshot
          path: |
            weekly_snapshot.csv
            universe.csv
          if-no-files-found: ignore
          retention-days: 14

      # always() so a CANCELLED or failed build still commits the rows it
      # managed to produce. Run #7 was cancelled at 49 min and the whole
      # snapshot was discarded because this step was skipped.
      - name: Commit snapshot
        if: always()
        run: |
          if [[ -n "$(git status --porcelain weekly_snapshot.csv universe.csv)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add weekly_snapshot.csv universe.csv mcap.csv
            git commit -m "data: weekly snapshot $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      # BUG 50. A rate-limited build can exceed even a generous timeout. The
      # commit step above runs on always(), so whatever was finished IS saved -
      # and build_snapshot.py resumes from a partial file for the same week and
      # logic_version. Re-dispatching therefore continues rather than restarts.
      #
      # This checks whether the week is actually armed and, if not, kicks off
      # one continuation run. It never loops forever: the guard is that a
      # continuation only fires when progress was made.
      # BUG 50. A rate-limited build can exceed even a generous timeout. The
      # commit step above runs on always(), so whatever finished IS saved - and
      # build_snapshot.py resumes from a partial file for the same week and
      # logic_version. Re-dispatching therefore CONTINUES rather than restarts.
      - name: Continue if the snapshot is incomplete
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - > rows.txt <<'PYEOF'
          from datetime import date, timedelta
          import pandas as pd
          t = date.today()
          w = t - timedelta(days=t.weekday())
          try:
              d = pd.read_csv("weekly_snapshot.csv", dtype=str)
              n = int((d["week_start"].astype(str).str.strip() == str(w)).sum())
          except Exception:
              n = 0
          print(n)
          PYEOF
          ROWS=$(cat rows.txt)
          echo "rows armed for the current week: ${ROWS}"
          # 1,400 is the practical floor - below that the scan universe is
          # materially incomplete.
          if [[ "${ROWS}" -ge 1400 ]]; then
            echo "snapshot is usable - no continuation needed"
            exit 0
          fi
          if [[ "${{ github.run_attempt }}" -ge 3 ]]; then
            echo "already attempted 3 times - stopping to avoid a loop"
            exit 0
          fi
          echo "incomplete (${ROWS} rows) - dispatching a continuation run"
          gh workflow run snapshot.yml --ref "${{ github.ref_name }}" \
            || echo "could not dispatch - re-run manually"

      - name: Report to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "Telegram secrets not set - skipping report"
            exit 0
          fi
          if [[ "${{ job.status }}" == "success" && -f weekly_snapshot.csv ]]; then
            ROWS=$(($(wc -l < weekly_snapshot.csv) - 1))
            MSG=$'✅ <b>Weekly snapshot rebuilt</b>\n'"${ROWS} symbols armed for the week."
          else
            MSG=$'🚨 <b>Weekly snapshot FAILED</b>\n'
            # Name the CAUSE, not just the symptom. On 09-Aug this failed with
            # DH-901 (expired Dhan token) and the alert said only "FAILED", so
            # the real reason sat in a log nobody opened. Every scan on 10-Aug
            # then refused to run until the token was renewed - correct
            # behaviour, but the 90 seconds of "why" was missing.
            if grep -q "DH-901\|Invalid_Authentication\|auth failed" build.log 2>/dev/null; then
              MSG+=$'<b>Cause: the DHAN_ACCESS_TOKEN is expired or invalid (DH-901).</b>\n'
              MSG+=$'Dhan tokens last ~30 days.\n'
              MSG+=$'Fix: generate a new token at web.dhan.co → My Profile → DhanHQ Trading APIs,\n'
              MSG+=$'then update the DHAN_ACCESS_TOKEN repo secret and re-run this workflow.\n\n'
            elif grep -q "429\|rate limit" build.log 2>/dev/null; then
              MSG+=$'<b>Cause: Dhan rate-limited the build.</b> Re-running usually clears it.\n\n'
            fi
            MSG+=$'The scanner does NOT fall back to old levels - it refuses to run.\n'
            MSG+=$'Expect NO alerts, NO shortlist and NO BTST scan until this is rebuilt.\n\n'
            MSG+=$'Re-run: Actions → Weekly Snapshot → Run workflow (tick <b>fresh</b>).'
          fi
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MSG}" > /dev/null
