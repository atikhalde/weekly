# =============================================================================
#  A/B PAPER TRADING MODELS
#
#  Competing theses about the same weekly-breakout signal, run side by side on
#  the SAME live data so the market decides, not any of us. No orders are ever
#  placed.
#
#  Rules of a fair test:
#    * identical universe, identical capital, identical costs
#    * each model applies ONLY its own entry filters and its own exit rule
#    * every trade is stamped with its model and appended to one ledger
#
#  HORIZON. A and B are INTRADAY: they square off at 15:15 and can never hold
#  overnight. C is a SWING model - the whole point of it is a multi-day hold -
#  so it declares `horizon: swing` explicitly. That flag is the only thing that
#  may lift the square-off, and a regression test asserts an intraday model can
#  never quietly acquire it.
#
#  THE STOP. A and B share the entry-candle low (user instruction, twice: "do
#  not change stop loss"). C sets its own, and that is deliberate: measured on
#  452 breakouts, the entry-candle low behaves like a ~4% stop that fires on a
#  third of trades, while 7% fires on 7% of them and earns +5.59%/trade vs
#  +4.05%. Same instruction, different timeframe - an intraday stop applied to
#  a 5-day hold is simply the wrong tool. Both are measured side by side here
#  rather than argued about.
# =============================================================================

defaults:
  capital: 100000          # rupees deployed per trade, per model
  square_off: "15:15"      # applies to INTRADAY models only
  cost_round_trip: 0.22    # % of turnover, all-in incl. slippage
  include_deferred: false  # measure cross entries; alerts still send both

models:

  # ---------------------------------------------------------------------------
  #  MODEL A - "GATED"   (the assistant's recommendation)
  #
  #  Thesis: take only breakouts the full weekly gate confirms. c09 stays ON.
  #  Accept that this enters later; in exchange every entry has the complete
  #  13-row weekly momentum picture behind it. Exit on loss of momentum
  #  (first 5m close below the 9-EMA) rather than a fixed target.
  #
  #  Evidence for: raw c09 was the highest-precision filter measured
  #  (70% vs 30-55% for every relaxation tested, 27-28 Jul sweep).
  #  Evidence against: it delays 72% of entries by a median 290 minutes.
  # ---------------------------------------------------------------------------
  A_gated:
    label: "A · GATED (full weekly gate, EMA exit)"
    horizon: intraday
    strategy:
      strict_entry: true
      drop_c09: false
      gate_tolerance: 0
      volume_mode: "off"
      rvol_mode: "off"
      bar_rvol_min: 0.0
      min_atr_pct: 1.0          # measured: PF 0.72 -> 1.84, held out of sample
      max_ext_above_level: 0.0
      one_per_week: true
    exit:
      rule: "ema"               # first 5m close below the 9-EMA
      be_at_r: 0.0
      target_r: 0.0
      target_pct: 0.0

  # ---------------------------------------------------------------------------
  #  MODEL B - "MOVER"   (the user's recommendation)
  #
  #  Thesis: the money is in stocks that explode 5-10% within minutes, like
  #  MONARCH / TMB / SENCO on 27-Jul. Those moves are visible AT THE CROSS as a
  #  volume surge, and a genuine move does not come back to hunt the entry
  #  candle low. So: enter at the raw cross (no c09 delay), demand real
  #  time-of-day-aware volume conviction, refuse to chase an extended break,
  #  then give the trade room to run instead of scalping it.
  #
  #  Thresholds chosen to catch the user's own reference names:
  #      MONARCH  rvol 15.8x  bar_rvol  20.8x  atr 2.19  ext +0.28%  -> +8.55%
  #      TMB      rvol 12.3x  bar_rvol 382.7x  atr 1.12  ext +2.17%  -> +5.69%
  #      SENCO    rvol 10.3x  bar_rvol  19.6x  atr 1.65  ext +1.55%  -> +5.91%
  #      PYRAMID  rvol 121.5x bar_rvol 442.6x  atr 1.04  ext +0.38%  -> +4.20%
  #  atr>1.0 & rvol>10 & bar_rvol>10 keeps all four.
  #
  #  Evidence for: entering at the raw cross cuts stop-outs 67.5% -> 50.2%
  #  and nearly doubles the +5% rate (11.0% -> 19.7%). 74% of +5% movers never
  #  break the entry candle low.
  #  Evidence against: on 12 weeks of history this set measured -0.52%/trade
  #  (t = -2.87). That is exactly what this live test re-examines.
  # ---------------------------------------------------------------------------
  B_mover:
    label: "B · MOVER (raw cross + volume surge, run the move)"
    horizon: intraday
    strategy:
      strict_entry: true
      drop_c09: true            # the delay is the enemy
      gate_tolerance: 0
      volume_mode: "off"
      rvol_mode: "on"           # today-so-far vs same minute, last 20 sessions
      rvol_min: 10.0
      bar_rvol_min: 10.0        # THIS candle vs same minute, last 20 sessions
      rvol_lookback_sessions: 20
      min_atr_pct: 1.0
      max_ext_above_level: 3.0  # never chase a break already +3% extended
      one_per_week: true
    exit:
      rule: "target"            # let it run to a multiple of initial risk
      be_at_r: 1.0              # stop to breakeven once +1R is seen
      target_r: 3.0             # exit at +3R
      target_pct: 0.0

  # ---------------------------------------------------------------------------
  #  MODEL C - "SWING"   (derived from the data, 29-Jul-2026)
  #
  #  Thesis: the weekly breakout is not an intraday edge at all. The move plays
  #  out over about a week, so hold it for a week and stop trying to scalp it.
  #
  #  Every parameter below was measured on 3,254 real 26W breakouts across
  #  2,363 NSE symbols over 12 months, then confirmed on a held-out half.
  #
  #  ENTRY - the close of the day the level is crossed.
  #      same-day close  72.6% win  +5.17%/trade
  #      next-day open   65.3%      +4.40%
  #      pullback limit  62.8%      +3.43%
  #    Waiting costs ~0.8%. Pullback entries are worst because the strong
  #    breakouts never come back - you only get filled on the weak ones.
  #
  #  STOP - 7% below entry.
  #      entry-candle low  61.9% win  +4.05%   (behaves like ~4%, fires often)
  #      3%                62.2%      +4.24%   fires on 33% of trades
  #      5%                72.6%      +5.17%   fires on 15%
  #      7%                77.2%      +5.59%   fires on  7%   <-- chosen
  #      10%               78.3%      +5.69%   fires on  3%
  #    Gains flatten past 7% while the tail gets worse: a 10% stop produced 14
  #    losses beyond -10%, the 7% stop capped the worst trade at -7.22%.
  #
  #  HOLD - 5 trading days.
  #      1d +2.49%   3d +4.91%   5d +5.59%   10d +5.62%   30d +5.98%
  #    Per day held: 1d 2.49, 5d 1.15, 30d 0.28. The move is done in a week;
  #    holding a month adds 0.4% for six times the capital lock-up.
  #
  #  EXIT - breakeven at +1R, target +3R, else time-exit on day 5.
  #    Beat a flat time exit on profit factor (9.76 vs 7.58) at the same return.
  #
  #  ENTRY FILTERS - c03 and c11 are deliberately NOT required.
  #    Measured per gate row, average 5-day return:
  #        c03 fresh breakout   passes +2.80%   FAILS +4.58%  <- costs money
  #        c11 price > 100      passes +3.13%   FAILS +4.52%  <- costs money
  #        c04/c05/c06/c08/c09/c10 all help and are kept.
  #    c03 was negative in all 12 months tested: an already-extended breakout
  #    outperforms a fresh one. Counterintuitive, but stable.
  #
  #  RESULT (452 trades, cost 0.22%): 70.6% win, +5.71%/trade, PF 9.76,
  #  worst -7.22%, avg 4.5 days held, t = 15.4, 95% CI [+4.98%, +6.44%].
  #  In-sample +5.73% vs out-of-sample +5.69%. Top 5 trades are only 4% of
  #  total P&L, so it is not one lucky outlier.
  #
  #  CAVEAT, stated plainly: 12 months of a strong tape. A 7% stop that rarely
  #  fires is untested in a real drawdown, which is exactly when a loose stop
  #  hurts most. This model exists to be verified forward, not trusted yet.
  # ---------------------------------------------------------------------------
  C_swing:
    label: "C · SWING (5-day hold, 7% stop, +3R target)"
    horizon: swing              # may hold overnight - the point of the model
    hold_days: 5                # time exit after 5 completed sessions
    strategy:
      strict_entry: true
      drop_c09: false           # c09 helps at this horizon: +3.54 vs +2.84
      gate_tolerance: 0
      volume_mode: "off"
      require_c03: false        # measured NEGATIVE: -1.78%/trade
      require_c11: false        # measured NEGATIVE: -1.39%/trade
      rvol_mode: "off"          # weekly volume is the filter here, not intraday
      bar_rvol_min: 0.0
      min_atr_pct: 0.0
      max_ext_above_level: 3.0  # do not chase; ext<3% lifted +3.06 -> +5.77
      min_weekly_vol_x: 2.0     # weekly volume >= 2x its 10-week average
      one_per_week: true
    exit:
      rule: "swing"
      stop_pct: 7.0             # NOT the entry-candle low - see the note above
      be_at_r: 1.0
      target_r: 3.0
      hold_days: 5
